      // =========================================================================
      // MÁSCARAS, VALIDAÇÕES E CÁLCULO DE IDADE
      // =========================================================================
      function unmaskDigits(value) {
        return String(value || '').replace(/\D/g, '');
      }

      function maskPhone(value) {
        const digits = unmaskDigits(value).slice(0, 11);
        if (digits.length === 0) return '';
        if (digits.length <= 2) return '(' + digits;
        if (digits.length <= 6) return '(' + digits.slice(0, 2) + ') ' + digits.slice(2);
        if (digits.length <= 10) {
          return '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 6) + '-' + digits.slice(6);
        }
        return '(' + digits.slice(0, 2) + ') ' + digits.slice(2, 7) + '-' + digits.slice(7);
      }

      function isValidPhone(value) {
        const digits = unmaskDigits(value);
        if (digits.length !== 10 && digits.length !== 11) return false;
        const ddd = Number(digits.slice(0, 2));
        if (ddd < 11 || ddd > 99) return false;
        if (/^(\d)\1+$/.test(digits)) return false;
        return true;
      }

      function maskBirthDate(value) {
        const digits = unmaskDigits(value).slice(0, 8);
        if (digits.length <= 2) return digits;
        if (digits.length <= 4) return digits.slice(0, 2) + '/' + digits.slice(2);
        return digits.slice(0, 2) + '/' + digits.slice(2, 4) + '/' + digits.slice(4);
      }

      function calculateAge(dateStr, referenceDate = new Date()) {
        const trimmed = String(dateStr || '').trim();
        if (!/^\d{2}\/\d{2}\/\d{4}$/.test(trimmed)) {
          return { valid: false, age: null, reason: 'incomplete' };
        }

        const parts = trimmed.split('/');
        const day = Number(parts[0]);
        const month = Number(parts[1]);
        const year = Number(parts[2]);

        if (year < 1900 || month < 1 || month > 12 || day < 1 || day > 31) {
          return { valid: false, age: null, reason: 'invalid' };
        }

        const birthDate = new Date(year, month - 1, day);
        if (
          birthDate.getFullYear() !== year ||
          birthDate.getMonth() !== month - 1 ||
          birthDate.getDate() !== day
        ) {
          return { valid: false, age: null, reason: 'invalid' };
        }

        const today = new Date(
          referenceDate.getFullYear(),
          referenceDate.getMonth(),
          referenceDate.getDate()
        );

        if (birthDate.getTime() > today.getTime()) {
          return { valid: false, age: null, reason: 'future' };
        }

        let age = today.getFullYear() - year;
        const monthDiff = today.getMonth() - (month - 1);
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < day)) {
          age -= 1;
        }

        if (age > 125) {
          return { valid: false, age: null, reason: 'too_old' };
        }

        return { valid: true, age };
      }

      function maskCep(value) {
        const digits = unmaskDigits(value).slice(0, 8);
        if (digits.length <= 5) return digits;
        return digits.slice(0, 5) + '-' + digits.slice(5);
      }

      function isValidCep(value) {
        return unmaskDigits(value).length === 8;
      }

      function isValidFullName(value) {
        const normalized = String(value || '').trim().replace(/\s+/g, ' ');
        if (!normalized) return false;
        const meaningfulWords = normalized
          .split(' ')
          .filter((word) => word.replace(/[^a-zA-ZÀ-ÿ]/g, '').length >= 2);
        return meaningfulWords.length >= 2;
      }

      function isValidUf(value) {
        const upper = String(value || '').trim().toUpperCase();
        return BRAZILIAN_UFS.indexOf(upper) !== -1;
      }

      function validateRegistrationForm(state) {
        const errors = {};

        if (!state.nome.trim()) {
          errors.nome = 'Por favor, escreva seu nome completo.';
        } else if (!isValidFullName(state.nome)) {
          errors.nome = 'Escreva o nome e pelo menos um sobrenome (ex.: Maria Silva).';
        }

        if (!unmaskDigits(state.telefone)) {
          errors.telefone = 'Por favor, informe um número de telefone ou WhatsApp.';
        } else if (!isValidPhone(state.telefone)) {
          errors.telefone = 'Informe um telefone válido com DDD (10 ou 11 números).';
        }

        const ageResult = calculateAge(state.dataNascimento);
        if (!unmaskDigits(state.dataNascimento)) {
          errors.dataNascimento = 'Por favor, informe sua data de nascimento.';
        } else if (!ageResult.valid) {
          if (ageResult.reason === 'incomplete') {
            errors.dataNascimento =
              'Digite a data completa no formato dia/mês/ano (ex.: 15/05/1958).';
          } else if (ageResult.reason === 'future') {
            errors.dataNascimento = 'A data de nascimento não pode ser no futuro.';
          } else {
            errors.dataNascimento = 'Esta data de nascimento não existe. Confira o dia e o mês.';
          }
        }

        if (!unmaskDigits(state.cep)) {
          errors.cep = 'Por favor, informe o CEP do seu endereço.';
        } else if (!isValidCep(state.cep)) {
          errors.cep = 'O CEP precisa ter 8 números (ex.: 01001-000).';
        }

        if (!state.rua.trim()) {
          errors.rua = 'Por favor, informe o nome da rua, avenida ou travessa.';
        }

        if (!state.numero.trim()) {
          errors.numero = 'Informe o número da casa (ou escreva S/N se não tiver).';
        }

        if (!state.bairro.trim()) {
          errors.bairro = 'Por favor, informe o bairro.';
        }

        if (!state.cidade.trim()) {
          errors.cidade = 'Por favor, informe a cidade.';
        }

        if (!state.uf.trim()) {
          errors.uf = 'Informe o estado (UF).';
        } else if (!isValidUf(state.uf)) {
          errors.uf = 'Informe uma sigla de estado válida (ex.: SP, RJ, MG).';
        }

        if (!state.tamanhoCamisa) {
          errors.tamanhoCamisa = 'Escolha o tamanho da sua camisa tocando em uma das opções.';
        }

        if (!state.fotoFrenteBase64) {
          errors.fotoFrenteBase64 =
            'Tire ou escolha uma foto da frente do seu documento (RG ou CNH).';
        }

        if (!state.consentimentoLgpd) {
          errors.consentimentoLgpd = 'Marque a caixinha acima para autorizar o envio do seu cadastro.';
        }

        return {
          isValid: Object.keys(errors).length === 0,
          errors,
          computedAge: ageResult.valid ? ageResult.age : null,
        };
      }

      function buildSubmissionPayload(state, idade) {
        return {
          nome: state.nome.trim().replace(/\s+/g, ' '),

      }

        const year = new Date().getFullYear();
        const safeSeq = Math.max(1, Math.floor(sequenceNumber));
        return 'CAD-' + year + '-' + String(safeSeq).padStart(4, '0');

      }

      // =========================================================================
      // COMPRESSÃO DE IMAGEM NO NAVEGADOR (MÁX 1600PX, JPEG 0.8)
      // =========================================================================
      function compressDocumentImage(file) {
        return new Promise((resolve, reject) => {
          if (!file || !file.type || !file.type.startsWith('image/')) {
            reject(new Error('Por favor, selecione um arquivo de imagem (foto).'));
            return;
          }

          const MAX_SIDE = 1600;
          const JPEG_QUALITY = 0.8;
          const objectUrl = URL.createObjectURL(file);
          const img = new Image();

          img.onload = () => {
            try {
              const width = img.naturalWidth || img.width || MAX_SIDE;
              const height = img.naturalHeight || img.height || MAX_SIDE;
              const longest = Math.max(width, height);
              const scale = longest > MAX_SIDE ? MAX_SIDE / longest : 1;
              const targetWidth = Math.round(width * scale);
              const targetHeight = Math.round(height * scale);

              const canvas = document.createElement('canvas');
              canvas.width = targetWidth;
              canvas.height = targetHeight;

              const ctx = canvas.getContext('2d');
              if (!ctx) {
                reject(new Error('Não foi possível preparar a foto no navegador.'));
                return;
              }

              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, targetWidth, targetHeight);
              ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

              const base64 = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
              resolve({ base64, width: targetWidth, height: targetHeight });
            } catch {
              reject(new Error('Não conseguimos processar esta foto. Tente tirar outra.'));
            } finally {
              URL.revokeObjectURL(objectUrl);
            }
          };

          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('Não conseguimos abrir esta foto. Tente tirar outra.'));
          };

          img.src = objectUrl;
        });
      }

      // =========================================================================
      // SERVIÇOS: VIACEP + ENVIO (HTMLSERVICE / FETCH / MODO DEMONSTRAÇÃO)
      // =========================================================================
      function hasGoogleScriptRun() {
        return Boolean(
          typeof window !== 'undefined' &&
            window.google &&
            window.google.script &&
            window.google.script.run &&
            typeof window.google.script.run.salvarCadastro === 'function'
        );
      }

      async function lookupCep(cepValue) {
        const digits = unmaskDigits(cepValue);
        if (digits.length !== 8) return { found: false };

        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 8000);

        try {
          const response = await fetch('https://viacep.com.br/ws/' + digits + '/json/', {
            signal: controller.signal,
          });
          if (!response.ok) {
            return {
              found: false,
              errorMessage:
                'Não foi possível consultar o CEP agora. Preencha o endereço manualmente.',
            };
          }
          const json = await response.json();
          if (json.erro) {
            return {
              found: false,
              errorMessage: 'CEP não encontrado. Você pode preencher o endereço abaixo manualmente.',
            };
          }
          return {
            found: true,
            data: {
              rua: json.logradouro || '',
              bairro: json.bairro || '',
              cidade: json.localidade || '',
              uf: json.uf || '',
            },
          };
        } catch {
          return {
            found: false,
            errorMessage: 'Sem resposta da busca de CEP. Preencha o endereço abaixo manualmente.',
          };
        } finally {
          window.clearTimeout(timeoutId);
        }
      }

      async function submitRegistration(payload, appsScriptUrl) {
        // 1. Execução nativa dentro do HtmlService do Google Apps Script
        if (hasGoogleScriptRun()) {
          return new Promise((resolve) => {
            window.google.script.run
              .withSuccessHandler((res) => {
                if (!res || typeof res !== 'object') {
                  resolve({ ok: false, error: 'Resposta inesperada do servidor.' });
                  return;
                }
                resolve({
                  ok: Boolean(res.ok),
                  protocolo: res.protocolo,
                  error: res.error,
                  isDemo: false,
                });
              })
              .withFailureHandler((err) => {
                resolve({
                  ok: false,
                  error:
                    err && err.message
                      ? err.message
                      : 'Erro ao salvar cadastro na planilha. Tente novamente.',
                });
              })
              .salvarCadastro(payload);
          });
        }

        // 2. Execução via HTTP POST para URL externa do Web App do Apps Script
        const cleanUrl = String(appsScriptUrl || '').trim();
        if (cleanUrl) {
          try {
            const response = await fetch(cleanUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload),
            });
            const rawText = await response.text();
            let parsed = null;
            try {
              parsed = JSON.parse(rawText);
            } catch {
              parsed = null;
            }
            if (!response.ok || !parsed) {
              return {
                ok: false,
                error:
                  'Não foi possível concluir o envio para a planilha. Verifique a conexão ou a configuração do link.',
              };
            }
            if (!parsed.ok) {
              return {
                ok: false,
                error: parsed.error || 'Ocorreu um erro ao salvar o cadastro.',
              };
            }
            return { ok: true, protocolo: parsed.protocolo, isDemo: false };
          } catch {
            return {
              ok: false,
              error: 'Falha na conexão com a planilha. Confira sua internet e tente novamente.',
            };
          }
        }

        // 3. Modo Demonstração quando aberto localmente sem Apps Script
        await new Promise((resolve) => window.setTimeout(resolve, 750));
        let nextSequence = 1;
        try {
          const savedSeq = Number(window.localStorage.getItem(STORAGE_KEYS.demoCounter) || '0');
          nextSequence = Number.isFinite(savedSeq) && savedSeq >= 0 ? savedSeq + 1 : 1;
          window.localStorage.setItem(STORAGE_KEYS.demoCounter, String(nextSequence));
        } catch {
          nextSequence = 1;
        }
        return {
          ok: true,
          protocolo: generateDemoProtocol(nextSequence),
          isDemo: true,
        };
      }

      // APLICAÇÃO PRINCIPAL

      function loadInitialFormState() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEYS.draft);
          if (!raw) return EMPTY_FORM_STATE;
          const parsed = JSON.parse(raw);
          return {
            ...EMPTY_FORM_STATE,
            nome: typeof parsed.nome === 'string' ? parsed.nome : '',
            telefone: typeof parsed.telefone === 'string' ? parsed.telefone : '',
            dataNascimento: typeof parsed.dataNascimento === 'string' ? parsed.dataNascimento : '',
            cep: typeof parsed.cep === 'string' ? parsed.cep : '',
            rua: typeof parsed.rua === 'string' ? parsed.rua : '',
            numero: typeof parsed.numero === 'string' ? parsed.numero : '',
            complemento: typeof parsed.complemento === 'string' ? parsed.complemento : '',
            bairro: typeof parsed.bairro === 'string' ? parsed.bairro : '',
            cidade: typeof parsed.cidade === 'string' ? parsed.cidade : '',
            uf: typeof parsed.uf === 'string' ? parsed.uf : '',
            tamanhoCamisa: typeof parsed.tamanhoCamisa === 'string' ? parsed.tamanhoCamisa : '',
            consentimentoLgpd: Boolean(parsed.consentimentoLgpd),
            fotoFrenteBase64: '',
            fotoVersoBase64: '',
          };
        } catch {
          return EMPTY_FORM_STATE;
        }
      }

      function App() {
        const [formState, setFormState] = useState(loadInitialFormState);
        const [errors, setErrors] = useState({});
        const [submitError, setSubmitError] = useState('');
        const [isSubmitting, setIsSubmitting] = useState(false);

        const [cepStatus, setCepStatus] = useState('idle');
        const [cepMessage, setCepMessage] = useState('');
        const lastFetchedCepRef = useRef('');

        const [isSizeChartOpen, setIsSizeChartOpen] = useState(false);
        const [successData, setSuccessData] = useState(null);

        useEffect(() => {
          if (successData) return;
          try {
            const draft = extractDraftFields(formState);
            window.localStorage.setItem(STORAGE_KEYS.draft, JSON.stringify(draft));
          } catch {
            // Ignora erro de storage
          }
        }, [formState, successData]);

        const agePreview = useMemo(() => {
          const result = calculateAge(formState.dataNascimento);
          return result.valid && result.age !== null ? result.age : null;
        }, [formState.dataNascimento]);

        const clearFieldError = useCallback((field) => {
          setErrors((prev) => {
            if (!prev[field]) return prev;
            const next = { ...prev };
            delete next[field];
            return next;
          });
          setSubmitError('');
        }, []);

        const handleFieldChange = useCallback(
          (field, value) => {
            setFormState((prev) => ({ ...prev, [field]: value }));
            clearFieldError(field);
          },
          [clearFieldError]
        );

        const handleCepChange = async (rawValue) => {
          const masked = maskCep(rawValue);
          handleFieldChange('cep', masked);

          const digits = unmaskDigits(masked);
          if (digits.length < 8) {
            lastFetchedCepRef.current = '';
            setCepStatus('idle');
            setCepMessage('');
            return;
          }

          if (digits === lastFetchedCepRef.current) return;

          lastFetchedCepRef.current = digits;
          setCepStatus('loading');
          setCepMessage('');

          const result = await lookupCep(digits);

          if (result.found && result.data) {
            setCepStatus('found');
            setCepMessage('Endereço encontrado! Confira abaixo e preencha o número.');
            setFormState((prev) => ({
              ...prev,
              rua: result.data.rua || prev.rua,
              bairro: result.data.bairro || prev.bairro,
              cidade: result.data.cidade || prev.cidade,
              uf: result.data.uf || prev.uf,
            }));
            setErrors((prev) => {
              const next = { ...prev };
              if (result.data.rua) delete next.rua;
              if (result.data.bairro) delete next.bairro;
              if (result.data.cidade) delete next.cidade;
              if (result.data.uf) delete next.uf;
              return next;
            });
          } else {
            setCepStatus('not_found');
            setCepMessage(
              result.errorMessage ||
                'CEP não encontrado. Você pode preencher o endereço abaixo manualmente.'
            );
          }
        };

        const scrollToFirstError = (errorMap) => {
          const fieldOrder = [
            'nome',
            'telefone',
            'dataNascimento',
            'cep',
            'rua',
            'numero',
            'bairro',
            'cidade',
            'uf',
            'tamanhoCamisa',
            'fotoFrenteBase64',
            'consentimentoLgpd',
          ];
          const firstKey = fieldOrder.find((key) => Boolean(errorMap[key]));
          if (!firstKey) return;
          const target = document.querySelector('[data-field-id="' + firstKey + '"]');
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        };

        const handleSubmit = async (event) => {
          event.preventDefault();
          if (isSubmitting) return;

          setSubmitError('');
          const validation = validateRegistrationForm(formState);

          if (!validation.isValid || validation.computedAge === null) {
            setErrors(validation.errors);
            setSubmitError('Por favor, confira os campos marcados em vermelho antes de enviar.');
            scrollToFirstError(validation.errors);
            return;
          }

          setIsSubmitting(true);
          try {
            const payload = buildSubmissionPayload(formState, validation.computedAge);
            const response = await submitRegistration(payload, APPS_SCRIPT_URL);

            if (!response.ok || !response.protocolo) {
              const errMsg = response.error || 'Não foi possível finalizar o cadastro.';
              setSubmitError(errMsg);
              if (errMsg.toLowerCase().indexOf('telefone') !== -1) {
                setErrors((prev) => ({ ...prev, telefone: errMsg }));
                scrollToFirstError({ telefone: errMsg });
              }
              return;
            }

            try {
              window.localStorage.removeItem(STORAGE_KEYS.draft);
            } catch {
              // Ignora erro de storage
            }

            setSuccessData({
              nome: payload.nome,
              protocolo: response.protocolo,
              isDemo: Boolean(response.isDemo),
            });
            window.scrollTo({ top: 0, behavior: 'auto' });
          } finally {
            setIsSubmitting(false);
          }
        };

        const handleStartNew = () => {
          setFormState(EMPTY_FORM_STATE);
          setErrors({});
          setSubmitError('');
          setCepStatus('idle');
          setCepMessage('');
          lastFetchedCepRef.current = '';
          setSuccessData(null);
          try {
            window.localStorage.removeItem(STORAGE_KEYS.draft);
          } catch {
            // Ignora erro de storage
          }
          window.scrollTo({ top: 0, behavior: 'auto' });
        };

        return (
          <div className="min-h-screen flex flex-col bg-[#F4F7FB] text-[#10203A]">
            <ProjectHeader />

            <main className="mx-auto w-full max-w-2xl flex-1 px-4 py-6 sm:px-6 sm:py-10">
              {successData ? (
                <SuccessScreen
                  nome={successData.nome}
                  protocolo={successData.protocolo}
                  isDemo={successData.isDemo}
                  onStartNew={handleStartNew}
                />
              ) : (
                <div className="space-y-6 sm:space-y-8">
                  {/* Aviso inicial simples e acolhedor */}
                  <div className="rounded-2xl border border-[#CBD9EC] bg-white px-5 py-4 text-center shadow-2xs sm:px-6 sm:py-5">
                    <p className="text-[19px] font-medium leading-relaxed text-[#10203A] sm:text-[20px]">
                      Preencha com calma. Tenha em mãos seu{' '}
                      <strong className="font-bold text-[#0A2E5C]">RG ou CNH</strong> e seu{' '}
                      <strong className="font-bold text-[#0A2E5C]">CEP</strong>.
                    </p>
                  </div>

                  {/* Formulário em coluna única organizada por passos */}
                  <form onSubmit={handleSubmit} noValidate className="space-y-6 sm:space-y-8">
                    {/* Passo 1: Dados Pessoais */}
                    <StepCard
                      stepNumber="1"
                      id="secao-dados-pessoais"
                      title="Seus dados pessoais"
                      subtitle="Escreva seu nome, telefone e data de nascimento."
                    >
                      <FormField id="nome" label="Nome completo" error={errors.nome}>
                        <input
                          id="nome"
                          name="nome"
                          type="text"
                          autoComplete="name"
                          value={formState.nome}
                          onChange={(e) => handleFieldChange('nome', e.target.value)}
                          placeholder="Ex.: Maria das Graças Silva"
                          aria-invalid={Boolean(errors.nome)}
                          aria-describedby={errors.nome ? 'nome-error' : undefined}
                          className={getInputClassName(Boolean(errors.nome))}
                        />
                      </FormField>

                      <FormField
                        id="telefone"
                        label="Telefone ou WhatsApp"
                        hint="Digite o DDD e o número. Pode ser um telefone de recado."
                        error={errors.telefone}
                      >
                        <input
                          id="telefone"
                          name="telefone"
                          type="tel"
                          inputMode="numeric"
                          autoComplete="tel"
                          value={formState.telefone}
                          onChange={(e) => handleFieldChange('telefone', maskPhone(e.target.value))}
                          placeholder="(11) 99999-9999"
                          aria-invalid={Boolean(errors.telefone)}
                          aria-describedby={errors.telefone ? 'telefone-error' : 'telefone-hint'}
                          className={getInputClassName(Boolean(errors.telefone))}
                        />
                      </FormField>

                      <FormField
                        id="dataNascimento"
                        label="Data de nascimento"
                        hint="Digite dia, mês e ano com 4 números (ex.: 15/05/1958)."
                        error={errors.dataNascimento}
                      >
                        <div className="flex flex-wrap items-center gap-4">
                          <input
                            id="dataNascimento"
                            name="dataNascimento"
                            type="text"
                            inputMode="numeric"
                            autoComplete="bday"
                            value={formState.dataNascimento}
                            onChange={(e) =>
                              handleFieldChange('dataNascimento', maskBirthDate(e.target.value))
                            }
                            placeholder="DD/MM/AAAA"
                            maxLength={10}
                            aria-invalid={Boolean(errors.dataNascimento)}
                            aria-describedby={
                              errors.dataNascimento
                                ? 'dataNascimento-error'
                                : 'dataNascimento-hint'
                            }
                            className={getInputClassName(
                              Boolean(errors.dataNascimento),
                              'max-w-[230px] tabular-nums'
                            )}
                          />

                          {agePreview !== null && (
                            <span
                              data-testid="idade-calculada"
                              className="inline-flex min-h-[48px] items-center rounded-xl bg-[#EAF2FC] px-4 py-2 text-[20px] font-bold text-[#0B4F9E] tabular-nums"
                            >
                              {agePreview} {agePreview === 1 ? 'ano' : 'anos'}
                            </span>
                          )}
                        </div>
                      </FormField>
                    </StepCard>

                    {/* Passo 2: Endereço */}
                    <StepCard
                      stepNumber="2"
                      id="secao-endereco"
                      title="Seu endereço"
                      subtitle="Digite o CEP para preencher a rua e o bairro automaticamente."
                    >
                      <FormField id="cep" label="CEP" error={errors.cep}>
                        <div className="flex flex-wrap items-center gap-3">
                          <input
                            id="cep"
                            name="cep"
                            type="text"
                            inputMode="numeric"
                            autoComplete="postal-code"
                            value={formState.cep}
                            onChange={(e) => handleCepChange(e.target.value)}
                            placeholder="00000-000"
                            maxLength={9}
                            aria-invalid={Boolean(errors.cep)}
                            aria-describedby={errors.cep ? 'cep-error' : undefined}
                            className={getInputClassName(
                              Boolean(errors.cep),
                              'max-w-[230px] tabular-nums'
                            )}
                          />

                          {cepStatus === 'loading' && (
                            <span className="inline-flex items-center gap-2 text-[18px] font-semibold text-[#0B4F9E]">
                              <Icon.Loader2 className="h-5 w-5 animate-spin" />
                              <span>Buscando endereço...</span>
                            </span>
                          )}
                        </div>

                        {cepMessage && (
                          <p
                            className={
                              'pt-1 text-[17px] font-semibold ' +
                              (cepStatus === 'found' ? 'text-[#166534]' : 'text-[#6B4E00]')
                            }
                          >
                            {cepMessage}
                          </p>
                        )}
                      </FormField>

                      <div className="grid grid-cols-1 gap-6 sm:grid-cols-4">
                        <div className="sm:col-span-3">
                          <FormField id="rua" label="Rua / Logradouro" error={errors.rua}>
                            <input
                              id="rua"
                              name="rua"
                              type="text"
                              autoComplete="street-address"
                              value={formState.rua}
                              onChange={(e) => handleFieldChange('rua', e.target.value)}
                              placeholder="Ex.: Rua das Flores"
                              aria-invalid={Boolean(errors.rua)}
                              aria-describedby={errors.rua ? 'rua-error' : undefined}
                              className={getInputClassName(Boolean(errors.rua))}
                            />
                          </FormField>
                        </div>

                        <div className="sm:col-span-1">
                          <FormField id="numero" label="Número" error={errors.numero}>
                            <input
                              id="numero"
                              name="numero"
                              type="text"
                              value={formState.numero}
                              onChange={(e) => handleFieldChange('numero', e.target.value)}
                              placeholder="Ex.: 123"
                              aria-invalid={Boolean(errors.numero)}
                              aria-describedby={errors.numero ? 'numero-error' : undefined}
                              className={getInputClassName(Boolean(errors.numero))}
                            />
                          </FormField>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 gap-6 sm:grid-cols-2">
                        <FormField
                          id="complemento"
                          label="Complemento"
                          optional
                          error={errors.complemento}
                        >
                          <input
                            id="complemento"
                            name="complemento"
                            type="text"
                            value={formState.complemento}
                            onChange={(e) => handleFieldChange('complemento', e.target.value)}
                            placeholder="Ex.: Casa 2, Apto 14"
                            className={getInputClassName(false)}
                          />
                        </FormField>

                        <FormField id="bairro" label="Bairro" error={errors.bairro}>
                          <input
                            id="bairro"
                            name="bairro"
                            type="text"
                            value={formState.bairro}
                            onChange={(e) => handleFieldChange('bairro', e.target.value)}
                            placeholder="Ex.: Centro"
                            aria-invalid={Boolean(errors.bairro)}
                            aria-describedby={errors.bairro ? 'bairro-error' : undefined}
                            className={getInputClassName(Boolean(errors.bairro))}
                          />
                        </FormField>
                      </div>

                      <div className="grid grid-cols-1 gap-6 sm:grid-cols-4">
                        <div className="sm:col-span-3">
                          <FormField id="cidade" label="Cidade" error={errors.cidade}>
                            <input
                              id="cidade"
                              name="cidade"
                              type="text"
                              autoComplete="address-level2"
                              value={formState.cidade}
                              onChange={(e) => handleFieldChange('cidade', e.target.value)}
                              placeholder="Ex.: São Paulo"
                              aria-invalid={Boolean(errors.cidade)}
                              aria-describedby={errors.cidade ? 'cidade-error' : undefined}
                              className={getInputClassName(Boolean(errors.cidade))}
                            />
                          </FormField>
                        </div>

                        <div className="sm:col-span-1">
                          <FormField id="uf" label="UF (Estado)" error={errors.uf}>
                            <input
                              id="uf"
                              name="uf"
                              type="text"
                              autoComplete="address-level1"
                              maxLength={2}
                              value={formState.uf}
                              onChange={(e) =>
                                handleFieldChange(
                                  'uf',
                                  e.target.value.replace(/[^a-zA-Z]/g, '').toUpperCase()
                                )
                              }
                              placeholder="SP"
                              aria-invalid={Boolean(errors.uf)}
                              aria-describedby={errors.uf ? 'uf-error' : undefined}
                              className={getInputClassName(Boolean(errors.uf), 'uppercase')}
                            />
                          </FormField>
                        </div>
                      </div>
                    </StepCard>

                    {/* Passo 3: Camisa */}
                    <StepCard
                      stepNumber="3"
                      id="secao-camisa"
                      title="Camisa do projeto"
                      subtitle="Escolha o tamanho da sua camisa."
                    >
                      <ShirtSizeSelector
                        value={formState.tamanhoCamisa}
                        error={errors.tamanhoCamisa}
                        onChange={(size) => handleFieldChange('tamanhoCamisa', size)}
                        onOpenSizeChart={() => setIsSizeChartOpen(true)}
                      />
                    </StepCard>

                    {/* Passo 4: Foto do Documento */}
                    <StepCard
                      stepNumber="4"
                      id="secao-documento"
                      title="Foto do documento (RG ou CNH)"
                      subtitle="Procure um lugar claro para que o nome e a foto fiquem legíveis."
                    >
                      <div className="space-y-5">
                        <PhotoCaptureField
                          id="fotoFrenteBase64"
                          title="Frente do documento"
                          description="Tire uma foto da frente da sua identidade (RG ou CNH)."
                          required
                          value={formState.fotoFrenteBase64}
                          error={errors.fotoFrenteBase64}
                          onChange={(base64) => handleFieldChange('fotoFrenteBase64', base64)}
                        />

                        <PhotoCaptureField
                          id="fotoVersoBase64"
                          title="Verso do documento"
                          description="Envie apenas se os dados ficarem no verso do documento."
                          required={false}
                          value={formState.fotoVersoBase64}
                          error={errors.fotoVersoBase64}
                          onChange={(base64) => handleFieldChange('fotoVersoBase64', base64)}
                        />
                      </div>
                    </StepCard>

                    {/* Passo 5: Consentimento LGPD e Envio */}
                    <StepCard
                      stepNumber="5"
                      id="secao-lgpd"
                      title="Autorização e envio"
                      subtitle="Marque a caixinha abaixo e toque no botão azul para concluir."
                    >
                      <div data-field-id="consentimentoLgpd" className="space-y-2">
                        <label
                          htmlFor="consentimentoLgpd"
                          className={
                            'flex min-h-[64px] cursor-pointer items-start gap-4 rounded-2xl border-2 p-5 transition-all ' +
                            (errors.consentimentoLgpd
                              ? 'border-[#B91C1C] bg-[#FFF8F8]'
                              : formState.consentimentoLgpd
                                ? 'border-[#0B4F9E] bg-[#F0F6FD] ring-4 ring-[#D6E6FA]'
                                : 'border-[#B8CAE0] bg-[#F8FAFE] hover:border-[#7B99C0]')
                          }
                        >
                          <span className="relative mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center">
                            <input
                              id="consentimentoLgpd"
                              name="consentimentoLgpd"
                              type="checkbox"
                              checked={formState.consentimentoLgpd}
                              onChange={(e) =>
                                handleFieldChange('consentimentoLgpd', e.target.checked)
                              }
                              aria-invalid={Boolean(errors.consentimentoLgpd)}
                              className="peer h-8 w-8 cursor-pointer appearance-none rounded-lg border-2 border-[#0B4F9E] bg-white checked:bg-[#0B4F9E] focus:outline-none"
                            />
                            <Icon.Check
                              className="pointer-events-none absolute h-5 w-5 text-white opacity-0 peer-checked:opacity-100"
                              strokeWidth={3}
                            />
                          </span>

                          <span className="text-[18px] sm:text-[19px] font-medium leading-relaxed text-[#10203A]">
                            {LGPD_CONSENT_TEXT}
                          </span>
                        </label>

                        {errors.consentimentoLgpd && (
                          <p
                            role="alert"
                            className="flex items-start gap-2 pt-1 text-[18px] font-semibold leading-snug text-[#B91C1C]"
                          >
                            <Icon.AlertCircle className="mt-0.5 h-5 w-5 shrink-0" />
                            <span>{errors.consentimentoLgpd}</span>
                          </p>
                        )}
                      </div>

                      <div className="space-y-4 pt-2">
                        {submitError && (
                          <div
                            role="alert"
                            className="flex items-start gap-3 rounded-2xl border-2 border-[#B91C1C] bg-[#FFF5F5] p-4 text-[18px] font-semibold text-[#991B1B]"
                          >
                            <Icon.AlertCircle className="mt-0.5 h-6 w-6 shrink-0" />
                            <span>{submitError}</span>
                          </div>
                        )}

                        <button
                          type="submit"
                          disabled={isSubmitting}
                          className="flex min-h-[64px] w-full items-center justify-center gap-3 rounded-2xl bg-[#0B4F9E] px-6 py-4 text-[21px] font-extrabold tracking-wide text-white shadow-sm transition-colors hover:bg-[#083872] disabled:cursor-not-allowed disabled:bg-[#6E92BE] active:scale-[0.99]"
                        >
                          {isSubmitting ? (
                            <React.Fragment>
                              <Icon.Loader2 className="h-6 w-6 shrink-0 animate-spin" />
                              <span>Enviando cadastro, aguarde...</span>
                            </React.Fragment>
                          ) : (
                            <React.Fragment>
                              <Icon.Send className="h-6 w-6 shrink-0" />
                              <span>ENVIAR CADASTRO</span>
                            </React.Fragment>
                          )}
                        </button>
                      </div>
                    </StepCard>
                  </form>
                </div>
              )}
            </main>

            <footer className="border-t border-[#D7E3F2] bg-white px-4 py-6 text-center text-[16px] text-[#3B5275]">
              <p>{PROJECT_CONFIG.name} · Cadastro das Participantes</p>
            </footer>

            <SizeChartModal
              isOpen={isSizeChartOpen}
              onClose={() => setIsSizeChartOpen(false)}
            />
          </div>
        );
      }

      const rootEl = document.getElementById('root');
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(rootEl).render(<App />);
      } else {
        ReactDOM.render(<App />, rootEl);
      }
    </script>
  </body>
</html>
